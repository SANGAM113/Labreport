  /* ── TOP NAV ── */
  .suite-nav{
    background:#14161c;border-bottom:1px solid #262a33;
    display:flex;align-items:center;gap:6px;padding:10px 16px;
    flex-wrap:wrap;position:sticky;top:0;z-index:100;

  }
  .suite-brand{

    margin-right:14px;white-space:nowrap;display:flex;align-items:center;gap:8px;
  }
  .suite-brand .dot{width:8px;height:8px;border-radius:50%;background:#3ddc84;box-shadow:0 0 8px #3ddc84;}
  .suite-tabs{display:flex;gap:6px;flex-wrap:wrap;flex:1;}
  .suite-tab{
    padding:9px 18px;border-radius:9px;border:1.5px solid #2a2e38;
    background:#1b1e26;color:#9aa3b2;font-size:12.5px;font-weight:600;
    cursor:pointer;transition:all .15s;white-space:nowrap;
    font-family:inherit;letter-spacing:.2px;
  }
  .suite-tab:hover{border-color:#3ddc84;color:#fff;}
  .suite-tab.active{background:#3ddc84;border-color:#3ddc84;color:#0f1115;box-shadow:0 4px 14px rgba(61,220,132,.25);}
  .suite-status{font-size:10.5px;color:#5a6272;white-space:nowrap;padding:0 4px;}

  /* ── STAGE (iframe holder) ── */
  .suite-stage{flex:1;position:relative;background:#f5f5f5;}
  .suite-frame{
    position:absolute;inset:0;width:100%;height:100%;border:none;
    display:none;background:#f5f5f5;
  }
  .suite-frame.active{display:block;}
  .suite-loader{
    position:absolute;inset:0;display:none;align-items:center;justify-content:center;
    flex-direction:column;gap:10px;background:#f5f5f5;color:#556;font-size:13px;font-weight:600;
    font-family:inherit;
  }
  .suite-loader.show{display:flex;}
  .spin{width:26px;height:26px;border:3px solid #cfd6de;border-top-color:#333;border-radius:50%;animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  @media (max-width:640px){
    .suite-brand{margin-right:8px;font-size:12px;}
    .suite-tab{padding:8px 12px;font-size:11.5px;}
    .suite-status{display:none;}
  }
</style>

function b64ToUtf8(b64) {
  const binary = atob(b64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return new TextDecoder('utf-8').decode(bytes);
}

const loaded = { coa:false, lar:false, lab:false };
let currentTool = null;

function loadTool(key) {
  if (loaded[key]) return;
  const html = b64ToUtf8(TOOL_SRC[key]);
  const frame = document.getElementById('frame-' + key);
  frame.srcdoc = html;
  frame.addEventListener('load', () => {
    document.getElementById('loader-' + key).classList.remove('show');
  }, { once:true });
  loaded[key] = true;
}

function switchTool(key) {
  currentTool = key;
  document.querySelectorAll('.suite-tab').forEach(b => b.classList.toggle('active', b.dataset.tool === key));
  document.querySelectorAll('.suite-frame').forEach(f => f.classList.remove('active'));
  document.querySelectorAll('.suite-loader').forEach(l => l.classList.remove('show'));

  loadTool(key);
  document.getElementById('frame-' + key).classList.add('active');
  if (!document.getElementById('frame-' + key).contentDocument ||
      document.getElementById('frame-' + key).contentDocument.readyState !== 'complete') {
    // loader may still show briefly until iframe fires load
  }
  const st = document.getElementById('suiteStatus');
  const names = { coa:'COA Generator', lar:'Lab Analysis Report', lab:'Lab Report System' };
  st.textContent = names[key] + ' — ready';
}

// Load first tool on startup
window.addEventListener('DOMContentLoaded', () => {
  switchTool('coa');
});

// ── Cloud bridge: parent performs Google Sheets reads for the Lab iframe ──
let __cloudBridgeSeq=0;
function __cloudBridgeJsonp(url){
  return new Promise((resolve,reject)=>{
    const cb='parentCloudCb_'+Date.now().toString(36)+'_'+(++__cloudBridgeSeq)+'_'+Math.random().toString(36).slice(2,7);
    const sc=document.createElement('script'); let done=false;
    const timer=setTimeout(()=>{if(done)return;done=true;cleanup();reject(new Error('Cloud read timeout'));},8000);
    function cleanup(){clearTimeout(timer);if(sc.parentNode)sc.parentNode.removeChild(sc);setTimeout(()=>{try{delete window[cb]}catch(e){window[cb]=undefined}},60000);}
    window[cb]=data=>{if(done)return;done=true;cleanup(); if(data&&data.ok===true)resolve(data.data); else reject(new Error((data&&data.error)||'Cloud read failed'));};
    sc.onerror=()=>{if(done)return;done=true;cleanup();reject(new Error('Cloud request failed'));};
    sc.src=__LAB_SYNC__.apiUrl.replace(/\/$/,'')+'?action=get&entity='+encodeURIComponent(url)+'&callback='+encodeURIComponent(cb)+'&_='+Date.now();
    document.head.appendChild(sc);
  });
}
async function __cloudBridgePost(entity,payload){
  const body=JSON.stringify({action:'upsert',entity,data:payload.data||{},updatedBy:payload.updatedBy||''});
  const url=__LAB_SYNC__.apiUrl.replace(/\/$/,'');
  await fetch(url,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body});
  return true;
}
window.addEventListener('message',async function(e){
  const d=e.data||{}; if(d.source!=='AuroSundramCloudBridge')return;
  if(d.action==='post'){
    try{await __cloudBridgePost(d.entity,d.payload||{}); e.source&&e.source.postMessage({source:'AuroSundramCloudBridge',requestId:d.requestId,ok:true},'*');}
    catch(err){e.source&&e.source.postMessage({source:'AuroSundramCloudBridge',requestId:d.requestId,ok:false,error:String(err)},'*');}
    return;
  }
  if(d.action!=='get')return;
  try{const data=await __cloudBridgeJsonp(d.entity); e.source&&e.source.postMessage({source:'AuroSundramCloudBridge',requestId:d.requestId,ok:true,data},'*');}
  catch(err){e.source&&e.source.postMessage({source:'AuroSundramCloudBridge',requestId:d.requestId,ok:false,error:String(err)},'*');}
});

// ── Fast IndexedDB bridge for Lab History (parent owns the DB) ──
const __LAB_IDB_NAME='AuroSundramQC_Local', __LAB_IDB_STORE='reports';
function __labOpenIDB(){return new Promise((resolve,reject)=>{try{const r=indexedDB.open(__LAB_IDB_NAME,1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains(__LAB_IDB_STORE))r.result.createObjectStore(__LAB_IDB_STORE,{keyPath:'reportId'});};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error||new Error('IndexedDB open failed'));}catch(e){reject(e)}})}
async function __labIDBGet(namespace){const db=await __labOpenIDB();return new Promise((resolve,reject)=>{const tx=db.transaction(__LAB_IDB_STORE,'readonly'),q=tx.objectStore(__LAB_IDB_STORE).getAll();q.onsuccess=()=>{const ns=String(namespace||'');const rows=q.result||[];const prefix=ns==='LAB'?'LR-':(ns?ns+'-':'');resolve(prefix?rows.filter(r=>String(r&&r.reportId||'').startsWith(prefix)):rows)};q.onerror=()=>reject(q.error||new Error('IndexedDB read failed'));})}
async function __labIDBSet(namespace,rows){const db=await __labOpenIDB();return new Promise((resolve,reject)=>{const tx=db.transaction(__LAB_IDB_STORE,'readwrite'),st=tx.objectStore(__LAB_IDB_STORE);const ns=String(namespace||'');const prefix=ns==='LAB'?'LR-':(ns?ns+'-':'');const q=st.getAll();q.onsuccess=()=>{(q.result||[]).forEach(r=>{if(!prefix||String(r&&r.reportId||'').startsWith(prefix))st.delete(r.reportId)});(Array.isArray(rows)?rows:[]).forEach(r=>{if(r&&r.reportId)st.put(r)});};tx.oncomplete=()=>resolve(true);tx.onerror=()=>reject(tx.error||new Error('IndexedDB write failed'));})}
window.addEventListener('message', async function(e){const d=e.data||{};if(d.source!=='AuroSundramLabIDB')return;try{let data=null;if(d.action==='get')data=await __labIDBGet(typeof d.payload==='string'?d.payload:'LAB');else if(d.action==='set'){const ns=d.payload&&d.payload.namespace?d.payload.namespace:'LAB';const rows=d.payload&&Array.isArray(d.payload.rows)?d.payload.rows:d.payload;data=await __labIDBSet(ns,rows);}e.source&&e.source.postMessage({source:'AuroSundramLabIDB',requestId:d.requestId,ok:true,data},'*');}catch(err){e.source&&e.source.postMessage({source:'AuroSundramLabIDB',requestId:d.requestId,ok:false,error:String(err)},'*');}});

// ── Lab History storage bridge for file:// + srcdoc ──
window.addEventListener('message', function(e){
  const d=e.data||{};
  if(d.source!=='AuroSundramLabBridge') return;
  let rows=[];
  try{rows=JSON.parse(localStorage.getItem('auro_sundram_lab_history')||'[]')||[];}catch(_){rows=[];}
  try{
    if(d.action==='get'){
      e.source.postMessage({source:'AuroSundramLabBridge',requestId:d.requestId,ok:true,data:rows},'*');
    } else if(d.action==='set'){
      rows=Array.isArray(d.payload)?d.payload.slice(0,100):[];
      try{localStorage.setItem('auro_sundram_lab_history',JSON.stringify(rows));}catch(_){ }
      e.source.postMessage({source:'AuroSundramLabBridge',requestId:d.requestId,ok:true,data:true},'*');
    }
  }catch(err){e.source.postMessage({source:'AuroSundramLabBridge',requestId:d.requestId,ok:false,error:String(err)},'*');}
});
